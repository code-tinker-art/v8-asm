name: Test v8-asm with Node.js

on:
  push:
    branches: [ main, add-github-actions ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Run basic test (fibonacci sequence)
      run: node main.js test.v8asm
    
    - name: Run register preservation test
      run: node main.js tests/register-preservation.v8asm
    
    - name: Run nested label test
      run: node main.js tests/nested-labels.v8asm
    
    - name: Run stack operations test
      run: node main.js tests/stack-operations.v8asm
